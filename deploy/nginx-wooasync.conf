# nginx del panel Wayan Sync. Copiar a /etc/nginx/conf.d/wooasync.neo-emarketing.com.conf
# y sacar el certificado con: certbot --nginx -d wooasync.neo-emarketing.com
# (certbot agrega solo el bloque HTTPS y la redirección).
server {
    listen 80;
    server_name wooasync.neo-emarketing.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
