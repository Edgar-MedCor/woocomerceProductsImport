# nginx para el panel. Cambiar sync.ejemplo.com por el subdominio real.
# Copiar a /etc/nginx/sites-available/wayan-sync, enlazar en sites-enabled y
# sacar el certificado con: sudo certbot --nginx -d sync.ejemplo.com
server {
    listen 80;
    server_name sync.ejemplo.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
